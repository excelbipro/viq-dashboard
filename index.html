<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIQ Dashboard</title>
<style>
 :root{--bg:#0f1420;--panel:#171e2e;--ink:#e8ecf5;--muted:#94a1bd;--line:#2a3450;--accent:#5b8cff}
 @media(prefers-color-scheme:light){:root{--bg:#f4f6fb;--panel:#fff;--ink:#1a2235;--muted:#5a6b8c;--line:#d9e0ee}}
 *{box-sizing:border-box}html,body{height:100%}
 body{margin:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);
      font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
 .card{max-width:440px;margin:20px;padding:30px 28px;background:var(--panel);border:1px solid var(--line);
       border-radius:16px;text-align:center}
 h1{font-size:20px;margin:0 0 10px}
 p{color:var(--muted);font-size:14px;line-height:1.55;margin:8px 0}
 .lock{font-size:34px}
</style></head><body>
 <div class="card">
   <div class="lock">&#128274;</div>
   <h1>VIQ Registration Dashboard</h1>
   <p>This dashboard is private. Please open the <b>personal link</b> that was shared with you.</p>
   <p>If you don't have one, contact the reporting team.</p>
 </div>
</body></html>
